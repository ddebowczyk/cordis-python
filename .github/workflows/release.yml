name: release

# Publishing is what a tag means. Everything the tag claims is re-checked
# first: a green CI run on `main` is not evidence about the commit that was
# tagged, and the artefact that reaches PyPI is the one this job built.
#
# The steps are capability commands, the same ones `just ops release gate`
# runs locally, so a release can be rehearsed before the tag exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: uv sync --all-extras
      - run: just ops control validate
      - run: just ops spec check
      - run: just ops quality all
      - run: just ops docs all
      # The tag exists by now, so this also checks that nothing is ahead of it
      # and that the changelog has a section for what is being published.
      - run: just ops version check
      # A release runs the exhaustive tier: the campaigns that are too long for
      # a pull request are exactly the ones worth running before publishing.
      - run: just ops test release

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: just ops packaging build
      - name: The tag and the package agree
        run: |
          version="$(uv run python -c 'import cordis; print(cordis.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || {
            echo "tag $tag does not match cordis.__version__ $version" >&2
            exit 1
          }
      - run: just ops packaging verify
      # Install the built wheel on every supported interpreter. Both 0.1.0
      # portability defects passed every source-tree gate and failed here.
      - run: just ops packaging smoke
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: no API token lives in this repository. Configure the
    # publisher once at https://pypi.org/manage/account/publishing/ for
    # project `cordis-python`, workflow `release.yml`, environment `pypi`.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
