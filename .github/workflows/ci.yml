name: ci

# Every step here invokes a capability command. The same list, in the same
# order, is `just ops workflow ci` -- and `just ops workflow ci-check` fails if
# the two ever stop agreeing. Nothing in this file describes *how* an operation
# works; that belongs to the capability that owns it.
#
# Nightly campaigns are in nightly.yml: a different question, on a different
# schedule, deliberately outside the comparison above.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    name: repository operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: uv sync --all-extras
      - run: just ops control validate
      - run: just ops control test
      - run: just ops workflow ci-check

  spec:
    name: capability catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: just ops spec check

  gate:
    name: lint, types and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: uv sync --all-extras
      - run: just ops quality all
      # A renamed export must not leave the reference describing the old name,
      # and the README's counts must still match the catalog.
      - run: just ops docs all

  package:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: just ops packaging build
      - run: just ops packaging verify
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  test:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PyPy is in the matrix to hold the package to pure Python. If a change
        # needs a C extension or a CPython implementation detail, this job is
        # where that decision surfaces -- before it ships, not after.
        python: ["3.11", "3.12", "3.13", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: extractions/setup-just@v3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --python ${{ matrix.python }}

      # Restore the shrunk counterexamples found by earlier runs so a failure
      # discovered once is replayed on every run afterwards, not rediscovered
      # by chance.
      - name: Restore Hypothesis example database
        uses: actions/cache/restore@v4
        with:
          path: .hypothesis/examples
          key: hypothesis-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ matrix.python }}-

      - run: just ops test pr

      - name: Save Hypothesis example database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .hypothesis/examples
          key: hypothesis-${{ matrix.python }}-${{ github.run_id }}
